name: Update NFL snapshot
on:
  workflow_dispatch:
  schedule:
    # UTC; offset minutes reduce contention. Not a guaranteed real-time schedule.
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: nfl-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the date-specific collection window
        id: window
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          start = datetime(2026, 9, 27, 16, 45, tzinfo=timezone.utc)
          end = datetime(2026, 9, 28, 5, 0, tzinfo=timezone.utc)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run={str(start <= now <= end).lower()}\n')
          PY
      - if: steps.window.outputs.run == 'true'
        run: python -m pip install 'jsonschema==4.23.0'
      - if: steps.window.outputs.run == 'true'
        run: python collect.py
      - name: Commit latest snapshot
        if: steps.window.outputs.run == 'true'
        run: |
          git config user.name 'NFL snapshot bot'
          git config user.email 'nfl-snapshot@users.noreply.github.com'
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL snapshot'
            git push
          fi
